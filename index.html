<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>Random Start Timer</title>
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center;
    background: #111; color: #fff;
    font: 600 1.5rem system-ui, sans-serif;
    padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none; -webkit-user-select: none;
  }
  body.ready { background: #d97706; }
  body.go { background: #16a34a; }
  main { display: grid; justify-items: center; gap: 1.5rem; text-align: center; }
  button {
    width: min(70vw, 60vh, 320px); aspect-ratio: 1; border-radius: 50%;
    border: 0; background: #16a34a; color: #fff;
    font: 800 2.5rem system-ui, sans-serif;
    touch-action: manipulation; cursor: pointer;
  }
  button:disabled { background: #333; color: #888; cursor: default; }
  button:focus-visible { outline: 4px solid #fff; outline-offset: 4px; }
  #status { min-height: 1.5em; margin: 0; }
</style>
</head>
<body>
<main>
  <button id="start" type="button">Start</button>
  <p id="status" role="status" aria-live="assertive"></p>
</main>
<script>
  // All times in seconds.
  const BEEP = 1, GAP = 1, GO = 1.5, LOCKOUT = 5;
  const HOLD_MIN = 0.5, HOLD_MAX = 2.5; // random wait before the go beep
  const READY_HZ = 880, GO_HZ = 1320;

  const btn = document.getElementById('start');
  const status = document.getElementById('status');
  let ctx;

  // iOS 17+: play through the silent switch.
  if (navigator.audioSession) navigator.audioSession.type = 'playback';

  async function keepAwake() {
    try { await navigator.wakeLock?.request('screen'); } catch {}
  }
  keepAwake();
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') keepAwake();
  });

  // Run fn when the audio clock reaches t.
  function at(t, fn) {
    setTimeout(fn, Math.max(0, (t - ctx.currentTime) * 1000));
  }

  function cue(t, dur, hz, cls, text) {
    const osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.type = 'square';
    osc.frequency.value = hz;
    // 5ms ramps avoid clicks.
    gain.gain.setValueAtTime(0, t);
    gain.gain.linearRampToValueAtTime(0.5, t + 0.005);
    gain.gain.setValueAtTime(0.5, t + dur - 0.005);
    gain.gain.linearRampToValueAtTime(0, t + dur);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t);
    osc.stop(t + dur);
    at(t, () => { document.body.className = cls; status.textContent = text; });
    at(t + dur, () => { document.body.className = ''; });
  }

  btn.addEventListener('click', async () => {
    btn.disabled = true;
    ctx ??= new AudioContext();
    await ctx.resume();
    keepAwake();

    const t1 = ctx.currentTime + 0.1;
    const t2 = t1 + BEEP + GAP;
    const t3 = t2 + BEEP + HOLD_MIN + Math.random() * (HOLD_MAX - HOLD_MIN);
    cue(t1, BEEP, READY_HZ, 'ready', 'Ready');
    cue(t2, BEEP, READY_HZ, 'ready', 'Set');
    cue(t3, GO, GO_HZ, 'go', 'GO!');
    at(t3 + GO, () => { status.textContent = 'Wait…'; });
    at(t3 + GO + LOCKOUT, () => { btn.disabled = false; status.textContent = ''; });
  });
</script>
</body>
</html>
